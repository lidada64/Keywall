name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tests/Keywall.Tests/Keywall.Tests.csproj --configfile NuGet.Config
      - run: dotnet run --project tests/Keywall.Tests/Keywall.Tests.csproj -c Release --no-restore
      - run: ./scripts/package.ps1
      - run: python tests/hook-smoke.py dist/keywall-win-x64/kw.exe
        env:
          KEYWALL_SESSION_DEBUG: '1'
      - run: python tests/global-hook-smoke.py dist/keywall-win-x64/kw.exe
      - run: python tests/ignored-env-smoke.py dist/keywall-win-x64/kw.exe
