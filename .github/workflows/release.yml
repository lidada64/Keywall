name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/Keywall.Tests/Keywall.Tests.csproj -c Release
      - run: ./scripts/package.ps1
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/keywall-0.1.5-win-x64.zip dist/keywall-0.1.5-win-x64.zip.sha256 --generate-notes
